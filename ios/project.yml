name: Tonari
options:
  bundleIdPrefix: jp.mugilab
  developmentLanguage: ja
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: 572NVCGLGQ
    CODE_SIGN_STYLE: Automatic
schemes:
  Tonari:
    build:
      targets:
        Tonari: all
        TonariTests: [test]
        TonariUITests: [test]
    test:
      targets: [TonariTests, TonariUITests]
    archive:
      config: Release
targets:
  Tonari:
    type: application
    platform: iOS
    sources: [Tonari]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.mugilab.tonari
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Tonari/Info.plist
      properties:
        CFBundleDisplayName: となり
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSMicrophoneUsageDescription: 診察の録音と、らむへの音声入力にマイクを使います。整理や送信は画面で操作したときに行います。
        NSCameraUsageDescription: らむへ送る写真を撮影するときにカメラを使います。
        NSPhotoLibraryUsageDescription: らむへ送る写真を端末の写真から選ぶときに使います。
        NSLocationWhenInUseUsageDescription: 病院までの移動の目安を調べるときに現在地を使います。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  TonariTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Tonari
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.mugilab.tonari.tests
        GENERATE_INFOPLIST_FILE: YES
  TonariUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Tonari
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.mugilab.tonari.uitests
        GENERATE_INFOPLIST_FILE: YES
