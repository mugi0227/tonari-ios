name: Tonari iOS build

# Simulator checks, then a signed archive of the same app source, uploaded to TestFlight.
# The IPA is never kept as an artifact here: this repository is public and the IPA carries the
# bundled app source.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: App source branch, tag or commit (private repository)
        required: true
        default: claude/ios-native
      status_build:
        description: Only report Apple's state of this uploaded build number (no build)
        required: false
        default: ''
      add_to_group:
        description: With status_build, the internal TestFlight group to add the build to
        required: false
        default: ''

permissions:
  contents: read
concurrency:
  group: tonari-ios-release
  cancel-in-progress: false
jobs:
  status:
    if: inputs.status_build != ''
    uses: ./.github/workflows/testflight-status.yml
    with:
      build: ${{ inputs.status_build }}
      add_to_group: ${{ inputs.add_to_group }}
    secrets: inherit

  test:
    if: inputs.status_build == ''
    uses: ./.github/workflows/ios-tests.yml
    with:
      source_ref: ${{ inputs.source_ref }}
    secrets: inherit

  release:
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      NSUnbufferedIO: YES
      TEAM_ID: 572NVCGLGQ
      MARKETING_VERSION: 0.3.0
      # Build numbers stay above the builds already uploaded.
      BUILD_OFFSET: 100
    steps:
      - name: Build number
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_OFFSET))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: app
        uses: ./.github/actions/prepare-app
        with:
          repository: ${{ vars.APP_SOURCE_REPO || 'mugi0227/Tonari' }}
          ref: ${{ needs.test.outputs.sha }}
          deploy-key: ${{ secrets.APP_SOURCE_DEPLOY_KEY }}
          firebase-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          require-firebase: 'true'
      - name: Check signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TONARI_SIGNING_P12: ${{ secrets.TONARI_SIGNING_P12 }}
          TONARI_SIGNING_PASSWORD: ${{ secrets.TONARI_SIGNING_PASSWORD }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TONARI_SIGNING_P12 TONARI_SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing $name"; exit 1; fi
          done
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Install the existing distribution identity
        working-directory: app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TONARI_SIGNING_P12: ${{ secrets.TONARI_SIGNING_P12 }}
          TONARI_SIGNING_PASSWORD: ${{ secrets.TONARI_SIGNING_PASSWORD }}
          DESTINATION: ${{ vars.TONARI_TESTFLIGHT_UPLOAD == 'true' && 'upload' || 'export' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/signing-env"
          "$RUNNER_TEMP/signing-env/bin/pip" install --quiet PyJWT==2.10.1 cryptography==45.0.6 PyYAML==6.0.2
          "$RUNNER_TEMP/signing-env/bin/python" scripts/ios/install_signing.py
          cd ios && xcodegen generate
      - name: Archive and verify distribution signing
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild archive -project Tonari.xcodeproj -scheme Tonari -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Tonari.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | xcbeautify --quiet
          python3 ../scripts/ios/verify_archive.py "$RUNNER_TEMP/Tonari.xcarchive/Products/Applications/Tonari.app"
      - name: Upload to TestFlight (or export only, when uploads are off)
        working-directory: app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Tonari.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/Tonari-ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | xcbeautify --quiet
          echo "App source ${{ needs.test.outputs.sha }}; $MARKETING_VERSION ($BUILD_NUMBER)." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credentials and build products
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          rm -rf "$RUNNER_TEMP/export" "$RUNNER_TEMP/Tonari.xcarchive"
          if [ -n "${TONARI_SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$TONARI_SIGNING_KEYCHAIN"; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tonari-ios-verification-${{ github.run_number }}
          path: ${{ runner.temp }}/archive-verification.json
          if-no-files-found: ignore
          retention-days: 14
