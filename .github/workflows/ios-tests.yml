name: Tonari iOS simulator checks

# Build-only public repository: the app source is private and checked out at run time with a
# read-only deploy key. Only simulator screenshots (fictional data) are kept as artifacts.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: App source branch, tag or commit (private repository)
        required: true
        default: claude/tonari-ios-ai-only-rt87vw
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
    outputs:
      sha:
        description: Commit of the app source that passed
        value: ${{ jobs.test.outputs.sha }}

permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.app.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NSUnbufferedIO: YES
      SIMULATOR_RUNTIME: iOS-18-5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: app
        uses: ./.github/actions/prepare-app
        with:
          repository: ${{ vars.APP_SOURCE_REPO || 'mugi0227/Tonari' }}
          ref: ${{ inputs.source_ref }}
          deploy-key: ${{ secrets.APP_SOURCE_DEPLOY_KEY }}
          firebase-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      - name: Select an iPhone simulator with a bounded wait
        working-directory: app
        run: python3 -u scripts/ios/select_simulator.py
      - name: Simulator tests and screenshots
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild test -project Tonari.xcodeproj -scheme Tonari -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/TonariTests.xcresult" \
            -parallel-testing-enabled NO -destination-timeout 120 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | xcbeautify --quiet
      # When the app cannot be launched, say why: which tests ran, and the app's crash report.
      # The simulator holds only the fictional fixture data; nothing from the app source is printed.
      - name: Why the tests failed
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/TonariTests.xcresult" ]; then
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/TonariTests.xcresult" --compact \
              | python3 -c 'import json,sys
          def walk(n,d=0):
              if n.get("nodeType") in ("Test Case","Unit test bundle","UI test bundle","Test Suite"): print("  "*d+n.get("name","")+": "+n.get("result",""))
              for c in n.get("children",[]): walk(c,d+1)
          for t in json.load(sys.stdin).get("testNodes",[]): walk(t)' || true
          fi
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Tonari* 2>/dev/null | head -1); do
            echo "=== $f"; head -c 16000 "$f"; echo
          done
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 30m --style compact \
            --predicate 'process == "Tonari" AND (messageType == error OR messageType == fault)' 2>/dev/null | tail -80 || true
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/TonariTests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/TonariTests.xcresult" --output-path "$RUNNER_TEMP/screenshots" || true
            # Keep images only; hierarchy dumps stay off a public artifact.
            find "$RUNNER_TEMP/screenshots" -type f ! -name '*.png' ! -name '*.jpeg' ! -name '*.jpg' -delete 2>/dev/null || true
          fi
          echo "Tested app source: ${{ steps.app.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tonari-ios-screenshots-${{ github.run_number }}
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: ignore
          retention-days: 14
